name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails if uv.lock is stale, so CI installs exactly what a
      # developer does rather than silently resolving something newer.
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .

      # The examples are typed as strictly as the library, so a port signature
      # change breaks them here before it breaks a reader. `tools/` is held to the
      # same bar: the API-reference generator is the only custom code between the
      # docstrings and the published site.
      - run: uv run mypy src examples tools

      - run: uv run pytest

      # And run them for real: type-checking wouldn't catch an example that
      # imports fine but no longer produces an answer.
      # assembled_engine.py skips itself with a message when TEST_DATABASE_URL is
      # unset, so it is safe to run here unconditionally.
      - name: Run the examples
        run: |
          uv run python examples/fakes_end_to_end.py
          uv run python examples/custom_embedder.py
          uv run python examples/custom_parser.py
          uv run python examples/assembled_engine.py

# The docs site is built and gated by `docs.yml`. It lives in its own workflow so
# that it can be skipped for changes that cannot reach it — GitHub filters paths
# per workflow, not per job — and so its Sphinx and npm dependency trees never
# slow down the gate that has to pass on every push.
