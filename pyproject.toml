[project]
name = "ragsage"
version = "0.1.0"
description = "A sage that only speaks from your corpus — a reusable, tenancy-agnostic RAG engine behind ports"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Niraj Kumar", email = "nirajk77777@gmail.com" }]
keywords = ["rag", "retrieval", "llm", "embeddings", "citations", "vector-search"]
# No `License ::` classifier: the license is declared above as an SPDX
# expression (PEP 639), and PyPI rejects a distribution that states it both ways.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

# The core was historically dependency-free; the heuristic parser (ragsage.parsing)
# retired that, and the shipped provider adapters (ragsage.providers) go further:
# per ADR-0002 they are core, not an extra, so `pip install ragsage` plus two API
# keys is a working engine.
#
# The two halves have different constraints and must not be confused:
#
#   * The parser stack is pure-Python / pure-Rust and pulls no numpy>=2, torch,
#     onnxruntime, transformers, or magika. That invariant is a deliberate
#     portability promise (ADR-0001, amended) and is enforced against
#     `ragsage.parsing`'s import graph by tests/test_dependency_guard.py. Token
#     counting uses tiktoken, deliberately not transformers.
#   * The provider SDKs do pull numpy 2.x and HuggingFace tokenizers (via
#     voyageai). That is fine — they are confined to `ragsage.providers`, which
#     nothing in the parser's or the top-level package's import graph touches.
dependencies = [
    # Parsing and chunking.
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.8",
    "puremagic>=1.28",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.12.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    # Provider adapters (ragsage.providers). The SDKs are named explicitly
    # alongside their LangChain integrations, rather than left to arrive
    # transitively, because they are what the adapters actually talk to.
    "langchain-core>=1.0",
    "langchain-openai>=1.4.1",
    "langchain-voyageai>=0.4.0",
    "openai>=2.0",
    "voyageai>=0.3",
    "pydantic>=2.0",
    # Storage (ADR-0002): ragsage owns its Postgres pool, so the async driver and
    # SQLAlchemy are core, not extras — `pip install ragsage` must yield a working
    # engine. Pinned to match the consuming backend so one deployment resolves a
    # single version of each. `ragsage.parsing` never imports them; see
    # tests/test_storage_imports.py.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # pgvector's SQLAlchemy type: what lets the dense store express
    # `cosine_distance` as an expression instead of hand-written SQL.
    "pgvector>=0.3",
]

[project.scripts]
ragsage = "ragsage.cli:main"

[project.urls]
Homepage = "https://github.com/nirajk77777/ragsage"
Repository = "https://github.com/nirajk77777/ragsage"
Issues = "https://github.com/nirajk77777/ragsage/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsage"]

# The sdist ships the repo, which is right for a library people are meant to be
# able to build and test from source — README, examples and tests all belong in
# it. Prose documentation no longer does: it lives in `website/`, which is a
# Next.js application, and a Python artifact has no business carrying one.
#
# This list is a *deny* list — everything not named here ships — so a new
# top-level directory is included by default and each exclusion below is a
# deliberate act. `website/node_modules` and `website/.next` need no entry of
# their own: hatchling honours VCS ignore, verified against the shipped v0.1.0
# sdist, which contains no `.venv/` despite one existing on disk.
[tool.hatch.build.targets.sdist]
exclude = [
    # The documentation site. TypeScript, a lockfile, and — the moment anyone runs
    # the dev server — a few hundred megabytes of `node_modules`.
    # tests/test_documentation_boundary.py asserts this holds.
    "website/",
    # Deliberately throwaway experiments (see prototypes/*/README.md). They live
    # in the repo as a record of how a decision was reached; publishing them would
    # put code nobody should import in front of a first-time reader.
    "prototypes/",
    ".scratch/",
    ".claude/",
    # Agent instructions, which point at repo-local scratch space that is itself
    # excluded — meaningless to anyone reading the sdist.
    "CLAUDE.md",
]

[dependency-groups]
# Dev tooling. Kept in step with the backend repo so `ruff`/`mypy`/`pytest`
# behave the same across both Python projects.
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "asgi-lifespan>=2.1",
    "reportlab>=5.0.0",
    # The build backend, so tests/test_documentation_boundary.py can build an
    # sdist and look inside it. A build frontend normally fetches this into an
    # isolated environment; a test that asserts over the artifact needs it here.
    "hatchling>=1.27",
]

# The API-reference generator. Sphinx is no longer the documentation site — that
# is Fumadocs, in `website/` — but it is still the only thing that resolves the
# 200-odd `:class:`/`:meth:`/`:mod:` cross-references the docstrings are written
# in. So it survives as a build-time data source: it reads `src/`,
# sphinx-markdown-builder writes Markdown, and `tools/generate_api_docs.py`
# corrects the two things that builder gets wrong.
#
# `furo` and `sphinx-copybutton` are gone with the HTML site: a theme and a
# browser-side button are of no use to a build that emits Markdown.
#
# Not in `dev`: this pulls Sphinx and its tree for no benefit to someone running
# the tests. The Dockerfile and CI ask for it by name (`--group docs`).
docs = [
    "sphinx>=8.1",
    "myst-parser>=4.0",
    "sphinx-markdown-builder>=0.6.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "ASYNC", "RUF"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
# The repository root, so `tools/` — the documentation generator and its two
# post-passes — is importable by its tests. `src/` is not added: the package is
# installed, and importing it two ways is how a test starts passing against code
# that is not the code being shipped.
pythonpath = ["."]
markers = [
    "integration: talks to a real Postgres (skipped unless TEST_DATABASE_URL is set)",
    "live_providers: talks to the real Voyage/OpenAI APIs (skipped unless RAGSAGE_LIVE_PROVIDERS=1 and keys are set)",
]
