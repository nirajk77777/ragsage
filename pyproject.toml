[project]
name = "ragsage"
version = "0.1.0"
description = "A sage that only speaks from your corpus — a reusable, tenancy-agnostic RAG engine behind ports"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Niraj Kumar", email = "nirajk77777@gmail.com" }]
keywords = ["rag", "retrieval", "llm", "embeddings", "citations", "vector-search"]
# No `License ::` classifier: the license is declared above as an SPDX
# expression (PEP 639), and PyPI rejects a distribution that states it both ways.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

# The core was historically dependency-free; the heuristic parser (ragsage.parsing)
# retired that, and the shipped provider adapters (ragsage.providers) go further:
# per ADR-0002 they are core, not an extra, so `pip install ragsage` plus two API
# keys is a working engine.
#
# The two halves have different constraints and must not be confused:
#
#   * The parser stack is pure-Python / pure-Rust and pulls no numpy>=2, torch,
#     onnxruntime, transformers, or magika. That invariant is a deliberate
#     portability promise (ADR-0001, amended) and is enforced against
#     `ragsage.parsing`'s import graph by tests/test_dependency_guard.py. Token
#     counting uses tiktoken, deliberately not transformers.
#   * The provider SDKs do pull numpy 2.x and HuggingFace tokenizers (via
#     voyageai). That is fine — they are confined to `ragsage.providers`, which
#     nothing in the parser's or the top-level package's import graph touches.
dependencies = [
    # Parsing and chunking.
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.8",
    "puremagic>=1.28",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.12.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    # Provider adapters (ragsage.providers). The SDKs are named explicitly
    # alongside their LangChain integrations, rather than left to arrive
    # transitively, because they are what the adapters actually talk to.
    "langchain-core>=1.0",
    "langchain-openai>=1.4.1",
    "langchain-voyageai>=0.4.0",
    "openai>=2.0",
    "voyageai>=0.3",
    "pydantic>=2.0",
    # Storage (ADR-0002): ragsage owns its Postgres pool, so the async driver and
    # SQLAlchemy are core, not extras — `pip install ragsage` must yield a working
    # engine. Pinned to match the consuming backend so one deployment resolves a
    # single version of each. `ragsage.parsing` never imports them; see
    # tests/test_storage_imports.py.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # pgvector's SQLAlchemy type: what lets the dense store express
    # `cosine_distance` as an expression instead of hand-written SQL.
    "pgvector>=0.3",
]

[project.scripts]
ragsage = "ragsage.cli:main"

[project.urls]
Homepage = "https://github.com/nirajk77777/ragsage"
Repository = "https://github.com/nirajk77777/ragsage"
Issues = "https://github.com/nirajk77777/ragsage/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsage"]

# The sdist ships the repo, which is right for a library people are meant to be
# able to build and test from source — README, docs, examples and tests all belong
# in it. These do not: agent scratch space, and `prototypes/`, which holds
# deliberately throwaway experiments (see prototypes/*/README.md). They live in the
# repo as a record of how a decision was reached; publishing them would put code
# nobody should import in front of a first-time reader.
[tool.hatch.build.targets.sdist]
exclude = [
    "prototypes/",
    ".scratch/",
    ".claude/",
    # Agent instructions, which point at repo-local scratch space that is itself
    # excluded — meaningless to anyone reading the sdist.
    "CLAUDE.md",
]

[dependency-groups]
# Dev tooling. Kept in step with the backend repo so `ruff`/`mypy`/`pytest`
# behave the same across both Python projects.
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "asgi-lifespan>=2.1",
    "reportlab>=5.0.0",
]

# Documentation. Sphinx rather than MkDocs because the docstrings are already
# written in Sphinx's dialect — 200-odd `:class:`/`:meth:`/`:mod:` cross-references
# and numpydoc `Parameters` sections — which mkdocstrings would render as literal
# text. MyST keeps the prose (ADRs, failure modes) in Markdown regardless.
#
# Not in `dev`: a docs build pulls Sphinx and its tree for no benefit to someone
# running the tests. Read the Docs and CI ask for it by name (`--group docs`).
docs = [
    "sphinx>=8.1",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "ASYNC", "RUF"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: talks to a real Postgres (skipped unless TEST_DATABASE_URL is set)",
    "live_providers: talks to the real Voyage/OpenAI APIs (skipped unless RAGSAGE_LIVE_PROVIDERS=1 and keys are set)",
]
