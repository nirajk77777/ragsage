[project]
name = "ragsage"
version = "0.1.0"
description = "A sage that only speaks from your corpus — a reusable, tenancy-agnostic RAG engine behind ports"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["rag", "retrieval", "llm", "embeddings", "citations", "vector-search"]
# The core was historically dependency-free; the heuristic parser (ragsage.parsing)
# retires that. These are all pure-Python / pure-Rust and pull in no numpy>=2,
# torch, or onnxruntime — so the library still runs on the deployment's
# x86-64-v1 CPU. Token counting uses tiktoken, deliberately not transformers.
dependencies = [
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.8",
    "puremagic>=1.28",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.12.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    # Storage (ADR-0002): ragsage owns its Postgres pool, so the async driver and
    # SQLAlchemy are core, not extras — `pip install ragsage` must yield a working
    # engine. Pinned to match the consuming backend so one deployment resolves a
    # single version of each. `ragsage.parsing` never imports them; see
    # tests/test_storage_imports.py.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[project.scripts]
ragsage = "ragsage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsage"]

[dependency-groups]
# Dev tooling. Kept in step with the backend repo so `ruff`/`mypy`/`pytest`
# behave the same across both Python projects.
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "asgi-lifespan>=2.1",
    "reportlab>=5.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "ASYNC", "RUF"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: talks to a real Postgres (skipped unless TEST_DATABASE_URL is set)",
]
