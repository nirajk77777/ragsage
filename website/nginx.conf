server {
    listen 80;
    server_name _;

    # Not `/usr/share/nginx/html`. That directory arrives already populated, and
    # copying the export over it merges rather than replaces: the export's own
    # `index.html` wins, but the base image's `50x.html` has no counterpart to
    # overwrite it and survives, served at `/50x` as part of the site — a route no
    # content file corresponds to. The build gate cannot see it: it runs over the
    # export, which is correct, not over the image, which is what deploys.
    root /srv/site;
    index index.html;

    # Next.js static export writes `quickstart.html`, not `quickstart/index.html`
    # — `trailingSlash` is off in next.config.mjs, and this line is the other half
    # of that decision. Change one without the other and every page 404s.
    #
    # The `=404` at the end is load-bearing. Coolify offers an SPA configuration
    # that falls back to the homepage instead, which would turn every broken link
    # into a silent redirect to the front page — hiding exactly the failures the
    # build gate exists to catch, and doing it only in production, where nobody is
    # looking.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # The site's own not-found page, which the static export writes and which
    # nothing would otherwise serve. No `=200` rewrite: the reader gets the site's
    # navigation and search instead of a bare server error, but a crawler, a link
    # checker and the deploy gate all still get told the page is missing.
    error_page 404 /404.html;

    # The prebuilt Orama search index, exported by the `/api/search` route
    # handler. It has no file extension, so nginx would otherwise serve it as
    # application/octet-stream.
    location = /api/search {
        default_type application/json;
        try_files $uri =404;
    }

    # Hashed filenames, so these are safe to cache for as long as anyone will
    # keep them. Everything else stays revalidated: a docs deploy that leaves
    # readers on yesterday's prose is the failure mode worth avoiding here.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
